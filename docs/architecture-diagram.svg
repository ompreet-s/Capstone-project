<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c463f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f7f8f4"/>

  <text x="40" y="42" font-size="22" font-weight="700" fill="#16211b">Static Web Application Hosting — AWS Architecture</text>
  <text x="40" y="64" font-size="13" fill="#62705f">Capstone Project 1</text>

  <!-- Internet -->
  <rect x="500" y="90" width="200" height="50" rx="6" fill="#ffffff" stroke="#b9c3b2"/>
  <text x="600" y="120" font-size="14" text-anchor="middle" fill="#16211b">Internet / Browser</text>

  <!-- AWS Cloud boundary -->
  <rect x="60" y="170" width="1080" height="560" rx="10" fill="#ffffff" stroke="#c98a2c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="196" font-size="13" font-weight="700" fill="#c98a2c">AWS CLOUD (Region)</text>

  <!-- IGW -->
  <rect x="500" y="215" width="200" height="46" rx="6" fill="#eef1ea" stroke="#3c6e47" stroke-width="1.5"/>
  <text x="600" y="243" font-size="13" text-anchor="middle" fill="#16211b">Internet Gateway</text>

  <!-- VPC boundary -->
  <rect x="100" y="285" width="1000" height="420" rx="10" fill="#f2f4ee" stroke="#3c6e47" stroke-width="1.5"/>
  <text x="120" y="308" font-size="13" font-weight="700" fill="#3c6e47">VPC — 10.0.0.0/16</text>

  <!-- Route table -->
  <rect x="130" y="325" width="940" height="40" rx="6" fill="#ffffff" stroke="#b9c3b2"/>
  <text x="600" y="350" font-size="12.5" text-anchor="middle" fill="#16211b">Public Route Table — 0.0.0.0/0 → Internet Gateway</text>

  <!-- Public Subnet 1 -->
  <rect x="130" y="385" width="440" height="290" rx="8" fill="#ffffff" stroke="#7a9c82" stroke-width="1.5"/>
  <text x="150" y="410" font-size="12.5" font-weight="700" fill="#3c6e47">Public Subnet 1 — 10.0.1.0/24 (AZ-a)</text>

  <!-- EC2 instance box -->
  <rect x="160" y="430" width="380" height="160" rx="6" fill="#eef1ea" stroke="#3c6e47" stroke-width="1.5"/>
  <text x="350" y="452" font-size="13" font-weight="700" text-anchor="middle" fill="#16211b">EC2 Instance</text>
  <text x="350" y="472" font-size="11.5" text-anchor="middle" fill="#3c463f">Amazon Linux 2023 · Nginx</text>
  <text x="350" y="490" font-size="11" text-anchor="middle" fill="#62705f">Security Group:</text>
  <text x="350" y="506" font-size="11" text-anchor="middle" fill="#62705f">22/tcp ← My IP only</text>
  <text x="350" y="522" font-size="11" text-anchor="middle" fill="#62705f">80/tcp ← 0.0.0.0/0</text>
  <text x="350" y="544" font-size="11" text-anchor="middle" fill="#c98a2c">IAM Role attached:</text>
  <text x="350" y="560" font-size="10.5" text-anchor="middle" fill="#62705f">S3 read-only + CloudWatch agent</text>

  <!-- Elastic/public IP marker -->
  <rect x="200" y="605" width="300" height="34" rx="6" fill="#ffffff" stroke="#b9c3b2"/>
  <text x="350" y="627" font-size="11.5" text-anchor="middle" fill="#16211b">Public IP</text>

  <!-- Public Subnet 2 -->
  <rect x="590" y="385" width="440" height="290" rx="8" fill="#ffffff" stroke="#7a9c82" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="610" y="410" font-size="12.5" font-weight="700" fill="#3c6e47">Public Subnet 2 — 10.0.2.0/24 (AZ-b)</text>
  <text x="810" y="500" font-size="11.5" text-anchor="middle" fill="#62705f">Reserved for high</text>
  <text x="810" y="518" font-size="11.5" text-anchor="middle" fill="#62705f">availability / future scaling</text>

  <!-- S3 bucket (outside VPC, region-level) -->
  <rect x="820" y="718" width="0" height="0"/>
  <rect x="800" y="230" width="0" height="0"/>

  <!-- CloudWatch + SNS + S3 row below VPC -->
  <rect x="100" y="720" width="1" height="1" fill="none"/>

  <!-- Bottom services row -->
  <rect x="100" y="500" width="0" height="0"/>

  <!-- S3, CloudWatch, SNS placed to the right, outside VPC box conceptually but within AWS cloud -->
  <g>
    <rect x="130" y="740" width="1" height="1"/>
  </g>

  <!-- Redraw service row beneath VPC, still inside AWS cloud boundary -->
  <rect x="60" y="170" width="0" height="0"/>

  <!-- S3 bucket box -->
  <rect x="900" y="470" width="150" height="90" rx="8" fill="#eef1ea" stroke="#c98a2c" stroke-width="1.5"/>
  <text x="975" y="500" font-size="12" font-weight="700" text-anchor="middle" fill="#16211b">S3 Bucket</text>
  <text x="975" y="518" font-size="10.5" text-anchor="middle" fill="#62705f">Private, versioned</text>
  <text x="975" y="534" font-size="10.5" text-anchor="middle" fill="#62705f">Assets / backups</text>

  <!-- Arrow EC2 -> S3 (read-only via IAM role) -->
  <line x1="540" y1="500" x2="895" y2="505" stroke="#c98a2c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="700" y="495" font-size="10" fill="#c98a2c" text-anchor="middle">read-only (IAM role)</text>

  <!-- CloudWatch box -->
  <rect x="900" y="585" width="150" height="60" rx="8" fill="#eef1ea" stroke="#3c6e47" stroke-width="1.5"/>
  <text x="975" y="610" font-size="12" font-weight="700" text-anchor="middle" fill="#16211b">CloudWatch</text>
  <text x="975" y="628" font-size="10.5" text-anchor="middle" fill="#62705f">CPU alarm ≥ 70%</text>

  <!-- SNS box (outside VPC / cloud-level) -->
  <rect x="900" y="665" width="150" height="60" rx="8" fill="#ffffff" stroke="#3c6e47" stroke-width="1.5"/>
  <text x="975" y="690" font-size="12" font-weight="700" text-anchor="middle" fill="#16211b">SNS Topic</text>
  <text x="975" y="708" font-size="10.5" text-anchor="middle" fill="#62705f">Email subscription</text>

  <!-- Arrows: EC2 -> CloudWatch -> SNS -> mailbox -->
  <line x1="540" y1="560" x2="895" y2="612" stroke="#3c6e47" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="700" y="600" font-size="10" fill="#3c6e47" text-anchor="middle">CPU metric</text>

  <line x1="975" y1="645" x2="975" y2="663" stroke="#3c6e47" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- mailbox -->
  <rect x="1075" y="670" width="95" height="50" rx="6" fill="#ffffff" stroke="#b9c3b2"/>
  <text x="1122" y="700" font-size="11" text-anchor="middle" fill="#16211b">Email Alert</text>
  <line x1="1050" y1="695" x2="1073" y2="695" stroke="#3c6e47" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: Internet -> IGW -> RouteTable -> EC2 -->
  <line x1="600" y1="140" x2="600" y2="213" stroke="#3c463f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="600" y1="261" x2="600" y2="323" stroke="#3c463f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="350" y1="365" x2="350" y2="428" stroke="#3c463f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="80" y="200" width="0" height="0"/>
  <text x="1080" y="196" font-size="10.5" fill="#62705f" text-anchor="end">— traffic flow</text>
</svg>
